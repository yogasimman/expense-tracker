<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1060" viewBox="0 0 1700 1060">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .lane { stroke: #cbd5e1; stroke-width: 2; fill: #ffffff; }
      .lane-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .step { stroke: #64748b; stroke-width: 1.8; rx: 12; ry: 12; }
      .step-text { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrowHead); }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .note { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 10; ry: 10; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1060" fill="#f8fafc" />
  <text x="60" y="60" class="title">End-to-End Working Flow</text>
  <text x="60" y="90" class="subtitle">From login to trip approval, expense lifecycle, and analytics rendering</text>

  <rect x="60" y="140" width="250" height="840" class="lane" />
  <rect x="340" y="140" width="320" height="840" class="lane" />
  <rect x="690" y="140" width="320" height="840" class="lane" />
  <rect x="1040" y="140" width="320" height="840" class="lane" />
  <rect x="1390" y="140" width="250" height="840" class="lane" />

  <text x="120" y="176" class="lane-title">User / Admin</text>
  <text x="430" y="176" class="lane-title">Vue Frontend</text>
  <text x="770" y="176" class="lane-title">Express API</text>
  <text x="1110" y="176" class="lane-title">Models / Rules</text>
  <text x="1455" y="176" class="lane-title">PostgreSQL</text>

  <rect x="95" y="220" width="180" height="54" class="step" fill="#dbeafe" />
  <text x="112" y="252" class="step-text">Open /app/login</text>

  <rect x="390" y="220" width="220" height="58" class="step" fill="#dcfce7" />
  <text x="408" y="249" class="step-text">LoginView submits</text>
  <text x="408" y="266" class="small">email + password</text>

  <rect x="740" y="220" width="220" height="58" class="step" fill="#fee2e2" />
  <text x="758" y="249" class="step-text">POST /api/auth/login</text>
  <text x="758" y="266" class="small">create session + user payload</text>

  <rect x="1090" y="220" width="220" height="58" class="step" fill="#ede9fe" />
  <text x="1110" y="249" class="step-text">User.findByEmail</text>
  <text x="1110" y="266" class="small">bcrypt.compare(password)</text>

  <rect x="1430" y="220" width="170" height="58" class="step" fill="#fef3c7" />
  <text x="1450" y="249" class="step-text">users table</text>
  <text x="1450" y="266" class="small">sessions table</text>

  <path d="M275 247 L380 247" class="arrow" />
  <path d="M610 247 L730 247" class="arrow" />
  <path d="M960 247 L1080 247" class="arrow" />
  <path d="M1310 247 L1420 247" class="arrow" />

  <rect x="95" y="330" width="180" height="54" class="step" fill="#dbeafe" />
  <text x="110" y="361" class="step-text">Create a Trip</text>

  <rect x="390" y="326" width="220" height="62" class="step" fill="#dcfce7" />
  <text x="410" y="353" class="step-text">NewTripView + store</text>
  <text x="410" y="371" class="small">build itinerary payload</text>

  <rect x="740" y="326" width="220" height="62" class="step" fill="#fee2e2" />
  <text x="757" y="353" class="step-text">POST /api/trips</text>
  <text x="757" y="371" class="small">auth + role aware userId</text>

  <rect x="1090" y="326" width="220" height="62" class="step" fill="#ede9fe" />
  <text x="1110" y="353" class="step-text">Trip.create()</text>
  <text x="1110" y="371" class="small">transaction + itinerary inserts</text>

  <rect x="1430" y="326" width="170" height="62" class="step" fill="#fef3c7" />
  <text x="1450" y="350" class="step-text">trips</text>
  <text x="1450" y="366" class="small">trip_users</text>
  <text x="1450" y="382" class="small">flights/buses/trains/cabs</text>

  <path d="M275 357 L380 357" class="arrow" />
  <path d="M610 357 L730 357" class="arrow" />
  <path d="M960 357 L1080 357" class="arrow" />
  <path d="M1310 357 L1420 357" class="arrow" />

  <polygon points="835,450 900,505 835,560 770,505" class="decision" />
  <text x="794" y="500" class="step-text">Trip status</text>
  <text x="805" y="518" class="small">approved?</text>

  <rect x="95" y="462" width="180" height="54" class="step" fill="#dbeafe" />
  <text x="107" y="492" class="step-text">Add Expense</text>

  <rect x="390" y="450" width="220" height="80" class="step" fill="#dcfce7" />
  <text x="409" y="479" class="step-text">NewExpenseView</text>
  <text x="409" y="497" class="small">choose approved trip</text>
  <text x="409" y="515" class="small">optional receipt metadata</text>

  <rect x="1090" y="450" width="220" height="80" class="step" fill="#ede9fe" />
  <text x="1110" y="479" class="step-text">Expense.create()</text>
  <text x="1110" y="497" class="small">validate trip status</text>
  <text x="1110" y="515" class="small">insert expense + receipts</text>

  <rect x="1430" y="450" width="170" height="80" class="step" fill="#fef3c7" />
  <text x="1450" y="476" class="step-text">expenses</text>
  <text x="1450" y="494" class="small">receipts (BYTEA)</text>
  <text x="1450" y="512" class="small">status=pending</text>

  <path d="M275 488 L380 488" class="arrow" />
  <path d="M610 488 L760 505" class="arrow" />
  <path d="M900 505 L1080 488" class="arrow" />
  <path d="M1310 488 L1420 488" class="arrow" />

  <rect x="95" y="586" width="180" height="54" class="step" fill="#dbeafe" />
  <text x="108" y="617" class="step-text">Add Advance</text>

  <rect x="390" y="580" width="220" height="64" class="step" fill="#dcfce7" />
  <text x="410" y="608" class="step-text">NewAdvanceView</text>
  <text x="410" y="626" class="small">same approved-trip guard</text>

  <rect x="740" y="580" width="220" height="64" class="step" fill="#fee2e2" />
  <text x="758" y="608" class="step-text">POST /api/advances</text>
  <text x="758" y="626" class="small">create pending advance</text>

  <rect x="1090" y="580" width="220" height="64" class="step" fill="#ede9fe" />
  <text x="1110" y="608" class="step-text">Advance.create()</text>
  <text x="1110" y="626" class="small">status + metadata persisted</text>

  <rect x="1430" y="580" width="170" height="64" class="step" fill="#fef3c7" />
  <text x="1450" y="606" class="step-text">advances table</text>
  <text x="1450" y="624" class="small">status=pending</text>

  <path d="M275 612 L380 612" class="arrow" />
  <path d="M610 612 L730 612" class="arrow" />
  <path d="M960 612 L1080 612" class="arrow" />
  <path d="M1310 612 L1420 612" class="arrow" />

  <rect x="95" y="710" width="180" height="54" class="step" fill="#dbeafe" />
  <text x="108" y="741" class="step-text">Approve/Reject</text>

  <rect x="390" y="698" width="220" height="80" class="step" fill="#dcfce7" />
  <text x="412" y="726" class="step-text">ApprovalsView</text>
  <text x="412" y="744" class="small">bulk actions on tables</text>
  <text x="412" y="762" class="small">trip / expense / advance</text>

  <rect x="740" y="698" width="220" height="80" class="step" fill="#fee2e2" />
  <text x="760" y="726" class="step-text">POST status routes</text>
  <text x="760" y="744" class="small">/trips/:id/status</text>
  <text x="760" y="762" class="small">/expenses/* /advances/*</text>

  <rect x="1090" y="698" width="220" height="80" class="step" fill="#ede9fe" />
  <text x="1110" y="726" class="step-text">Model updates</text>
  <text x="1110" y="744" class="small">set approved_by, approved_at</text>
  <text x="1110" y="762" class="small">set rejection_reason</text>

  <rect x="1430" y="698" width="170" height="80" class="step" fill="#fef3c7" />
  <text x="1450" y="724" class="step-text">trips/expenses</text>
  <text x="1450" y="742" class="small">advances status</text>
  <text x="1450" y="760" class="small">auditable timestamps</text>

  <path d="M275 737 L380 737" class="arrow" />
  <path d="M610 737 L730 737" class="arrow" />
  <path d="M960 737 L1080 737" class="arrow" />
  <path d="M1310 737 L1420 737" class="arrow" />

  <rect x="390" y="850" width="220" height="60" class="step" fill="#dcfce7" />
  <text x="410" y="878" class="step-text">AnalyticsView requests</text>
  <text x="410" y="896" class="small">dashboard + analytics APIs</text>

  <rect x="740" y="850" width="220" height="60" class="step" fill="#fee2e2" />
  <text x="760" y="878" class="step-text">GET /api/dashboard</text>
  <text x="760" y="896" class="small">GET /api/analytics/data</text>

  <rect x="1090" y="850" width="220" height="60" class="step" fill="#ede9fe" />
  <text x="1110" y="878" class="step-text">AnalyticsHelper SQL</text>
  <text x="1110" y="896" class="small">aggregate by status/type/category</text>

  <rect x="1430" y="850" width="170" height="60" class="step" fill="#fef3c7" />
  <text x="1450" y="878" class="step-text">Grouped queries</text>
  <text x="1450" y="896" class="small">Chart-ready payloads</text>

  <path d="M610 880 L730 880" class="arrow" />
  <path d="M960 880 L1080 880" class="arrow" />
  <path d="M1310 880 L1420 880" class="arrow" />

  <rect x="70" y="1000" width="950" height="42" class="note" />
  <text x="90" y="1026" class="small">Business gate: expense/advance creation is blocked unless trip status is approved and not finished. This rule is enforced server-side in ajax/api controllers before model writes.</text>
</svg>
